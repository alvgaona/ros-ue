name: release

run-name: "release ${{ github.ref_name }}"

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check tag matches VersionName
        run: test "$GITHUB_REF_NAME" = "v$(jq -r .VersionName RosBridge.uplugin)" || { echo "::error::Tag $GITHUB_REF_NAME does not match VersionName in RosBridge.uplugin"; exit 1; }

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        id: changelog
        with:
          config: cliff.toml
          args: --latest --strip header

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          body: ${{ steps.changelog.outputs.content }}
