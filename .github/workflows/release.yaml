name: release

run-name: "release ${{ github.ref_name }}"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.2
      - run: pixi run setup
      - run: pixi run package
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/*.zip

  release:
    needs: macos
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check tag matches VersionName
        run: test "$GITHUB_REF_NAME" = "v$(jq -r .VersionName RosBridge.uplugin)" || { echo "::error::Tag $GITHUB_REF_NAME does not match VersionName in RosBridge.uplugin"; exit 1; }

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        id: changelog
        with:
          config: cliff.toml
          args: --latest --strip header

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          body: ${{ steps.changelog.outputs.content }}
          files: dist/*.zip
          prerelease: ${{ contains(github.ref_name, '-') }}
