name: Feature
description: Something the plugin should do
labels: [enhancement]
body:
  - type: textarea
    attributes:
      label: Problem
      description: What you're trying to do and why the plugin can't today.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposal
      description: How it could work. If rclcpp or tf2_ros has an equivalent, name it.
