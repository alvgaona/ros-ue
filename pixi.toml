[workspace]
name = "ros-ue"
channels = ["https://prefix.dev/conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[activation.env]
RMW_IMPLEMENTATION = "rmw_cyclonedds_cpp"

[tasks]
talker = "ros2 run demo_nodes_cpp talker"
listener = "ros2 run demo_nodes_cpp listener"

[dependencies]
cmake = ">=4.4.3,<5"
git = ">=2.55.0,<3"
pillow = ">=12.3.0,<13"

[feature.jazzy]
channels = ["https://prefix.dev/robostack-jazzy"]

[feature.jazzy.tasks]
setup = "sh Scripts/setup.sh"

[feature.jazzy.dependencies]
ros-jazzy-demo-nodes-cpp = ">=0.33.11,<0.34"
ros-jazzy-ros2run = ">=0.32.11,<0.33"
ros-jazzy-ros2topic = ">=0.32.11,<0.33"
ros-jazzy-rmw-cyclonedds-cpp = ">=2.2.3,<3"
ros-jazzy-builtin-interfaces = ">=2.0.4,<3"
ros-jazzy-std-msgs = ">=5.3.8,<6"
ros-jazzy-geometry-msgs = ">=5.3.8,<6"
ros-jazzy-nav-msgs = ">=5.3.8,<6"
ros-jazzy-sensor-msgs = ">=5.3.8,<6"
ros-jazzy-tf2-msgs = ">=0.36.22,<0.37"
ros-jazzy-rosgraph-msgs = ">=2.0.4,<3"
ros-jazzy-rcl-interfaces = ">=2.0.4,<3"
ros-jazzy-tf2-ros-py = ">=0.36.22,<0.37"
ros-jazzy-rviz2 = ">=14.1.23,<15"
ros-jazzy-compressed-image-transport = ">=4.0.7,<5"

[feature.humble]
channels = ["https://prefix.dev/robostack-humble"]

[feature.humble.dependencies]
ros-humble-demo-nodes-cpp = ">=0.20.5,<0.21"
ros-humble-ros2run = ">=0.18.12,<0.19"
ros-humble-ros2topic = ">=0.18.12,<0.19"
ros-humble-rmw-cyclonedds-cpp = ">=1.3.4,<2"
ros-humble-builtin-interfaces = ">=1.2.1,<2"
ros-humble-std-msgs = ">=4.9.0,<5"
ros-humble-geometry-msgs = ">=4.9.0,<5"
ros-humble-nav-msgs = ">=4.9.0,<5"
ros-humble-sensor-msgs = ">=4.9.0,<5"
ros-humble-tf2-msgs = ">=0.25.14,<0.26"
ros-humble-rosgraph-msgs = ">=1.2.1,<2"
ros-humble-rcl-interfaces = ">=1.2.1,<2"
ros-humble-tf2-ros-py = ">=0.25.14,<0.26"

[feature.kilted]
channels = ["https://prefix.dev/robostack-kilted"]

[feature.kilted.dependencies]
ros-kilted-demo-nodes-cpp = ">=0.36.4,<0.37"
ros-kilted-ros2run = ">=0.38.3,<0.39"
ros-kilted-ros2topic = ">=0.38.3,<0.39"
ros-kilted-rmw-cyclonedds-cpp = ">=4.0.2,<5"
ros-kilted-builtin-interfaces = ">=2.3.1,<3"
ros-kilted-std-msgs = ">=5.5.2,<6"
ros-kilted-geometry-msgs = ">=5.5.2,<6"
ros-kilted-nav-msgs = ">=5.5.2,<6"
ros-kilted-sensor-msgs = ">=5.5.2,<6"
ros-kilted-tf2-msgs = ">=0.41.6,<0.42"
ros-kilted-rosgraph-msgs = ">=2.3.1,<3"
ros-kilted-rcl-interfaces = ">=2.3.1,<3"
ros-kilted-tf2-ros-py = ">=0.41.6,<0.42"

[feature.lyrical]
channels = ["https://prefix.dev/robostack-lyrical"]

[feature.lyrical.dependencies]
ros-lyrical-demo-nodes-cpp = ">=0.37.9,<0.38"
ros-lyrical-ros2run = ">=0.40.9,<0.41"
ros-lyrical-ros2topic = ">=0.40.9,<0.41"
ros-lyrical-rmw-cyclonedds-cpp = ">=4.1.5,<5"
ros-lyrical-builtin-interfaces = ">=2.4.5,<3"
ros-lyrical-std-msgs = ">=5.9.3,<6"
ros-lyrical-geometry-msgs = ">=5.9.3,<6"
ros-lyrical-nav-msgs = ">=5.9.3,<6"
ros-lyrical-sensor-msgs = ">=5.9.3,<6"
ros-lyrical-tf2-msgs = ">=0.45.9,<0.46"
ros-lyrical-rosgraph-msgs = ">=2.4.5,<3"
ros-lyrical-rcl-interfaces = ">=2.4.5,<3"
ros-lyrical-tf2-ros-py = ">=0.45.9,<0.46"

[feature.lint.tasks]
lint = "ruff check && ruff format --check && git ls-files '*.cpp' '*.h' | xargs clang-format --dry-run --Werror"
format = "ruff check --fix && ruff format && git ls-files '*.cpp' '*.h' | xargs clang-format -i"

[feature.lint.dependencies]
ruff = ">=0.16.9,<0.17"
clang-format = ">=23.1.2,<24"

[environments]
default = ["jazzy"]
humble = ["humble"]
kilted = ["kilted"]
lyrical = ["lyrical"]
lint = { features = ["lint"], no-default-feature = true }
